<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidrixClient · Update Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --void-deep: #050308;
            --void-mid: #120a24;
            --void-high: #1d1038;
            --accent: #a855f7;
            --accent-2: #22d3ee;
            --accent-3: #f472b6;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --text-primary: #f6f2ff;
            --text-secondary: #9d92c4;
            --success: #4ade80;
            --warning: #fbbf24;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            -webkit-app-region: drag;
        }

        /* ====== Rahmen (füllt das transparente Fenster) ====== */
        .frame {
            position: fixed;
            inset: 0;
            border-radius: 22px;
            overflow: hidden;
            background: var(--void-deep);
            border: 1px solid rgba(168, 85, 247, 0.28);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.07),
                inset 0 0 100px rgba(88, 28, 135, 0.20);
            display: flex;
            flex-direction: column;
            align-items: center;
            isolation: isolate;
        }

        /* animierte, mehrfarbige Licht-Kante oben (kräftiger Signature-Streifen) */
        .frame::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            z-index: 30;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--accent) 22%,
                var(--accent-3) 42%,
                var(--accent-2) 58%,
                var(--accent) 78%,
                transparent 100%);
            background-size: 250% 100%;
            animation: edgeShine 4.5s linear infinite;
            pointer-events: none;
        }

        /* weicher Bloom-Schein unter der Kante */
        .frame::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 14px;
            z-index: 29;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--accent) 22%,
                var(--accent-3) 42%,
                var(--accent-2) 58%,
                var(--accent) 78%,
                transparent 100%);
            background-size: 250% 100%;
            filter: blur(9px);
            opacity: 0.55;
            animation: edgeShine 4.5s linear infinite;
            pointer-events: none;
        }

        @keyframes edgeShine {
            from { background-position: 130% 0; }
            to   { background-position: -130% 0; }
        }

        /* Diagonaler Glas-Reflex, der periodisch über den ganzen Rahmen zieht */
        .glass-sweep {
            position: absolute;
            top: -10%;
            left: -60%;
            width: 34%;
            height: 130%;
            z-index: 8;
            pointer-events: none;
            background: linear-gradient(78deg,
                transparent, rgba(255, 255, 255, 0.05) 42%,
                rgba(255, 255, 255, 0.14) 50%, rgba(255, 255, 255, 0.05) 58%, transparent);
            mix-blend-mode: screen;
            animation: sweepMove 7.5s ease-in-out infinite;
        }

        @keyframes sweepMove {
            0%   { left: -60%; }
            22%  { left: 140%; }
            100% { left: 140%; }
        }

        /* Ambiente-Glow in den Ecken */
        .corner-glow {
            position: absolute;
            width: 240px;
            height: 240px;
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: screen;
            filter: blur(6px);
        }

        .corner-glow.tl {
            top: -110px;
            left: -110px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.32), transparent 70%);
        }

        .corner-glow.br {
            bottom: -110px;
            right: -110px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.24), transparent 70%);
        }

        /* feine Scanlines für den "Premium-Screen"-Look */
        .scanlines {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: 0.5;
            mix-blend-mode: overlay;
            background: repeating-linear-gradient(to bottom,
                rgba(255, 255, 255, 0.035) 0px, rgba(255, 255, 255, 0.035) 1px,
                transparent 1px, transparent 3px);
        }

        /* Aurora / Void-Nebel im Hintergrund */
        .aurora {
            position: absolute;
            inset: -30%;
            z-index: 1;
            background:
                radial-gradient(40% 30% at 25% 30%, rgba(168, 85, 247, 0.18), transparent 70%),
                radial-gradient(35% 28% at 75% 22%, rgba(34, 211, 238, 0.11), transparent 70%),
                radial-gradient(45% 35% at 55% 65%, rgba(129, 60, 220, 0.13), transparent 70%);
            filter: blur(30px);
            animation: auroraDrift 16s ease-in-out infinite alternate;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        @keyframes auroraDrift {
            0%   { transform: translate(-2.5%, -1.5%) rotate(-2deg) scale(1); }
            50%  { transform: translate(2%, 1.5%) rotate(1.5deg) scale(1.06); }
            100% { transform: translate(-1%, 2.5%) rotate(-1deg) scale(1.02); }
        }

        /* Aufsteigende Void-Partikel im Hintergrund */
        .void-particles {
            position: absolute;
            inset: 0;
            z-index: 2;
            overflow: hidden;
            pointer-events: none;
        }

        .void-particle {
            position: absolute;
            bottom: -6px;
            border-radius: 50%;
            animation-name: particleRise;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes particleRise {
            0%   { transform: translateY(0) scale(0.6); opacity: 0; }
            10%  { opacity: var(--p-op, 0.7); }
            85%  { opacity: var(--p-op, 0.7); }
            100% { transform: translateY(-620px) scale(1); opacity: 0; }
        }

        /* ====== Inhalt ====== */
        .content {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 38px 30px 22px;
        }

        /* Facettierter Kristall-Ring + Logo */
        .logo-stage {
            position: relative;
            width: 132px;
            height: 132px;
            display: grid;
            place-items: center;
            margin-bottom: 10px;
            opacity: 0;
            animation: riseIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }

        .hex-ring {
            position: absolute;
            inset: -8px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: conic-gradient(from 0deg,
                var(--accent) 0deg, var(--accent-3) 120deg,
                var(--accent-2) 240deg, var(--accent) 360deg);
            animation: ringSpin 5s linear infinite;
            filter: drop-shadow(0 0 11px var(--accent-glow));
        }

        .hex-ring::after {
            content: '';
            position: absolute;
            inset: 7px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: var(--void-deep);
        }

        .hex-ring.slow {
            inset: -19px;
            opacity: 0.4;
            animation-duration: 8.5s;
            animation-direction: reverse;
        }

        .hex-ring.slow::after {
            inset: 7px;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        /* Funken, die um das Logo kreisen */
        .orbit {
            position: absolute;
            inset: -12px;
            animation: ringSpin var(--orbit-dur, 5s) linear infinite;
            pointer-events: none;
        }

        .orbit::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            width: 5px; height: 5px;
            margin-left: -2.5px;
            background: var(--orbit-color, var(--accent));
            box-shadow: 0 0 8px var(--orbit-color, var(--accent));
        }

        .orbit.o2 { inset: -20px; animation-duration: 8s; animation-direction: reverse; --orbit-color: var(--accent-2); }
        .orbit.o2::before { width: 4px; height: 4px; }
        .orbit.o3 { inset: -4px; animation-duration: 3.4s; --orbit-color: #d8b4fe; }
        .orbit.o3::before { width: 3px; height: 3px; }

        .logo-glow {
            position: absolute;
            inset: 14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4), transparent 70%);
            animation: glowPulse 2.6s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(0.95); }
            50%      { opacity: 1;   transform: scale(1.08); }
        }

        .logo {
            width: 86px;
            height: 86px;
            border-radius: 20px;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 14px var(--accent-glow));
            animation: logoFloat 3.2s ease-in-out infinite alternate;
        }

        .logo-fallback {
            display: none;
            width: 86px;
            height: 86px;
            border-radius: 20px;
            position: relative;
            z-index: 2;
            place-items: center;
            font-size: 2.4rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(135deg, #2a1650, #17102b 60%);
            border: 1px solid rgba(168, 85, 247, 0.5);
            text-shadow: 0 0 16px var(--accent);
            filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 14px var(--accent-glow));
            animation: logoFloat 3.2s ease-in-out infinite alternate;
        }

        @keyframes logoFloat {
            0%   { transform: translateY(2px)  scale(1); }
            100% { transform: translateY(-4px) scale(1.03); }
        }

        /* Titel */
        .brand {
            position: relative;
            text-align: center;
            margin-bottom: 16px;
            opacity: 0;
            animation: riseIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .brand h1 {
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            transform: skewX(-8deg);
        }

        /* Buchstaben fallen sanft ins Bild */
        .brand h1 span {
            display: inline-block;
            opacity: 0;
            background: linear-gradient(110deg,
                #ffffff 20%, #d8b4fe 38%, #ffffff 50%, #67e8f9 62%, #ffffff 80%);
            background-size: 220% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 26px rgba(168, 85, 247, 0.4);
            animation:
                letterDrop 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) forwards,
                titleShine 4s ease-in-out infinite;
            animation-delay: calc(0.45s + var(--i) * 0.07s), calc(var(--i) * 0.12s);
        }

        @keyframes letterDrop {
            0%   { opacity: 0; transform: translateY(-26px) scale(1.4); filter: blur(5px); }
            60%  { opacity: 1; transform: translateY(3px)  scale(0.97); filter: blur(0); }
            100% { opacity: 1; transform: translateY(0)    scale(1); }
        }

        @keyframes titleShine {
            0%, 100% { background-position: 0% 0; }
            50%      { background-position: 100% 0; }
        }

        .brand-underline {
            width: 96px;
            height: 3px;
            margin: 7px auto 0;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-3), var(--accent-2));
            background-size: 220% 100%;
            box-shadow: 0 0 10px var(--accent-glow);
            opacity: 0;
            transform: scaleX(0);
            transform-origin: center;
            animation:
                underlineGrow 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards,
                titleShine 4s ease-in-out infinite 0.95s;
        }

        @keyframes underlineGrow {
            to { opacity: 1; transform: scaleX(1); }
        }

        .brand .sub {
            margin-top: 6px;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.5em;
            text-indent: 0.5em;
            text-transform: uppercase;
            color: var(--text-secondary);
            opacity: 0;
            animation: fadeIn 0.8s ease 1.1s forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* Status-Karte – angeschnittene Ecken für den technischen Look */
        .status-core {
            width: 100%;
            position: relative;
            background: rgba(10, 6, 20, 0.68);
            border: 1px solid rgba(168, 85, 247, 0.22);
            clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
            padding: 15px 18px;
            backdrop-filter: blur(11px);
            box-shadow: 0 12px 30px -14px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            opacity: 0;
            animation: riseIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
            overflow: hidden;
        }

        .status-message {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            font-size: 0.83rem;
            font-weight: 550;
            letter-spacing: 0.02em;
            color: var(--text-primary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            flex-shrink: 0;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 9px var(--accent);
            animation: pulseDot 1.2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.35; transform: scale(0.8); }
            50%      { opacity: 1;    transform: scale(1.2); }
        }

        /* Fortschrittsbalken – XP-Bar-Style */
        .progress-area {
            position: relative;
            z-index: 1;
            width: 100%;
            margin-top: 12px;
            display: none;
            flex-direction: column;
            gap: 7px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            padding: 0 2px;
        }

        .progress-label span { font-variant-numeric: tabular-nums; }

        .progress-track {
            position: relative;
            height: 13px;
            clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
            background: #100a20;
            border: 1px solid rgba(0, 0, 0, 0.6);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        /* Segment-Kerben wie bei einer XP-Bar */
        .progress-track::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg,
                transparent 0 calc(10% - 1px), rgba(0, 0, 0, 0.35) calc(10% - 1px) 10%);
            pointer-events: none;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #7c3aed, var(--accent) 45%, var(--accent-2));
            box-shadow: 0 0 12px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            transition: width 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            position: relative;
            overflow: hidden;
        }

        .progress-fill::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(-55deg,
                rgba(255, 255, 255, 0.18) 0 10px, transparent 10px 20px);
            animation: stripeMove 0.9s linear infinite;
        }

        /* heller Glüh-Kopf am Ende des Balkens */
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 10px; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55));
            filter: blur(1px);
        }

        @keyframes stripeMove {
            to { transform: translateX(28px); }
        }

        /* dezenter diagonaler Glasschimmer auf der Statuskarte */
        .status-core::after {
            content: '';
            position: absolute;
            top: -40%;
            left: -30%;
            width: 26%;
            height: 180%;
            background: linear-gradient(78deg, transparent, rgba(255, 255, 255, 0.06) 45%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.06) 55%, transparent);
            animation: sweepMove 5.5s ease-in-out infinite 1.2s;
            pointer-events: none;
        }

        /* Footer: Info + Tipp */
        .footer {
            margin-top: auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0;
            animation: riseIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards;
        }

        .info-footnote {
            font-size: 0.68rem;
            color: #8b7fb8;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 6px 15px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.25s;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .retry-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--warning);
        }

        .retry-badge i { font-style: normal; font-weight: 600; }

        .tip {
            min-height: 14px;
            font-size: 0.64rem;
            font-style: italic;
            letter-spacing: 0.02em;
            color: #7d72a8;
            text-align: center;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            transition: opacity 0.4s ease;
        }

        .tip.fade { opacity: 0; }

        /* Startup-Timer unten im Rahmen */
        .startup-timer-wrap {
            width: 100%;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .startup-timer-wrap.visible { opacity: 1; }

        .startup-timer-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: #b8aede;
            font-size: 0.64rem;
            letter-spacing: 0.05em;
        }

        .startup-timer-label span { font-variant-numeric: tabular-nums; }

        .startup-timer-track {
            height: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .startup-timer-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-3), var(--accent-2));
            background-size: 220% 100%;
            box-shadow: 0 0 10px var(--accent-glow);
            border-radius: 999px;
            transition: width 0.2s linear;
        }

        /* Text-Wechsel-Animation */
        .fade-up { animation: fadeSlide 0.25s ease-out; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(16px) scale(0.97); filter: blur(4px); }
            to   { opacity: 1; transform: translateY(0)    scale(1);    filter: blur(0); }
        }

        /* Intro-Blende */
        .intro-veil {
            position: absolute;
            inset: 0;
            z-index: 20;
            background: var(--void-deep);
            pointer-events: none;
            animation: veilOut 0.9s ease 0.1s forwards;
        }

        @keyframes veilOut {
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>

<body>
    <div class="frame">
        <div class="aurora"></div>
        <div class="corner-glow tl"></div>
        <div class="corner-glow br"></div>
        <div class="void-particles" id="voidParticles"></div>
        <div class="scanlines"></div>
        <div class="glass-sweep"></div>

        <div class="content">
            <div class="logo-stage">
                <div class="hex-ring"></div>
                <div class="hex-ring slow"></div>
                <div class="orbit"></div>
                <div class="orbit o2"></div>
                <div class="orbit o3"></div>
                <div class="logo-glow"></div>
                <img src="../resources/icon.png" alt="VoidrixClient" class="logo"
                     onerror="this.style.display='none';document.getElementById('logoFallback').style.display='grid';">
                <div class="logo-fallback" id="logoFallback">V</div>
            </div>

            <div class="brand">
                <h1 id="brandTitle">Voidrix</h1>
                <div class="brand-underline"></div>
                <div class="sub">Client</div>
            </div>

            <!-- Dynamischer Statusbereich -->
            <div class="status-core" id="statusCore">
                <div class="status-message" id="statusMessage">
                    <span class="status-dot"></span>
                    <span id="statusText">Suche nach Updates</span>
                </div>

                <!-- Fortschrittsanzeige -->
                <div class="progress-area" id="progressArea">
                    <div class="progress-label">
                        <span id="progressTitle">Update wird installiert</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div class="info-footnote" id="infoNote">
                    <span>⚡ Automatische Updates aktiv</span>
                </div>
                <div class="tip" id="tipText"></div>

                <div class="startup-timer-wrap" id="startupTimerWrap">
                    <div class="startup-timer-label">
                        <span>Client wird gestartet…</span>
                        <span id="startupTimerText">0%</span>
                    </div>
                    <div class="startup-timer-track">
                        <div class="startup-timer-fill" id="startupTimerFill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="intro-veil"></div>
    </div>

    <script>
        // In Electron verfügbar; im normalen Browser (Vorschau) läuft der Splash ohne IPC weiter.
        let ipcRenderer = { on: () => {} };
        try {
            const electron = require('electron');
            ipcRenderer = electron.ipcRenderer;
            // Gespeicherten Chromium-Zoom (Strg + Plus) neutralisieren, damit alles ins Fenster passt.
            if (electron.webFrame) {
                electron.webFrame.setZoomLevel(0);
                electron.webFrame.setZoomFactor(1);
            }
        } catch (e) {}

        // ====== DOM ======
        const statusTextSpan = document.getElementById('statusText');
        const progressArea = document.getElementById('progressArea');
        const progressFill = document.getElementById('progressFill');
        const progressTitle = document.getElementById('progressTitle');
        const progressPercentSpan = document.getElementById('progressPercent');
        const infoNote = document.getElementById('infoNote');
        const statusMessageDiv = document.getElementById('statusMessage');
        const startupTimerWrap = document.getElementById('startupTimerWrap');
        const startupTimerFill = document.getElementById('startupTimerFill');
        const startupTimerText = document.getElementById('startupTimerText');
        const tipText = document.getElementById('tipText');

        let startupTimerActive = false;
        let startupTimerDone = false;
        let realStartupFinished = false;
        let startupProgress = 0;

        function setStartupTimerProgress(value) {
            startupProgress = Math.max(0, Math.min(100, value));
            startupTimerFill.style.width = `${startupProgress}%`;
            startupTimerText.textContent = `${Math.round(startupProgress)}%`;
        }

        function finishStartupTimer() {
            if (!startupTimerActive || startupTimerDone) return;
            startupTimerDone = true;
            setStartupTimerProgress(100);
            setTimeout(() => startupTimerWrap.classList.remove('visible'), 320);
        }

        // ====== Titel in einzelne Buchstaben zerlegen (sanftes Drop-Intro) ======
        const brandTitle = document.getElementById('brandTitle');
        const titleText = brandTitle.textContent.trim();
        brandTitle.textContent = '';
        [...titleText].forEach((ch, i) => {
            const span = document.createElement('span');
            span.textContent = ch;
            span.style.setProperty('--i', i);
            brandTitle.appendChild(span);
        });

        // ====== Punkte-Animation für Statustext ======
        let dotInterval = null;
        let isDotsMode = true;

        function startDotsAnimation(baseText) {
            if (dotInterval) clearInterval(dotInterval);
            let dotCount = 0;
            isDotsMode = true;
            const updateDots = () => {
                if (!isDotsMode) return;
                dotCount = (dotCount + 1) % 4;
                statusTextSpan.innerText = baseText + '.'.repeat(dotCount);
            };
            updateDots();
            dotInterval = setInterval(updateDots, 480);
        }

        function stopDotsAndSetText(text) {
            if (dotInterval) {
                clearInterval(dotInterval);
                dotInterval = null;
            }
            isDotsMode = false;
            statusTextSpan.innerText = text;
        }

        function setStatusIcon(type = 'default') {
            const dot = statusMessageDiv.querySelector('.status-dot');
            if (!dot) return;
            if (type === 'progress') {
                dot.style.background = 'var(--success)';
                dot.style.boxShadow = '0 0 8px var(--success)';
            } else if (type === 'warning') {
                dot.style.background = 'var(--warning)';
                dot.style.boxShadow = '0 0 8px var(--warning)';
            } else {
                dot.style.background = 'var(--accent)';
                dot.style.boxShadow = '0 0 8px var(--accent)';
            }
        }

        function updateProgressUI(progressValue) {
            if (progressValue === undefined || progressValue === null) return;
            const percent = Math.min(100, Math.max(0, progressValue));
            progressFill.style.width = `${percent}%`;
            progressPercentSpan.innerText = `${Math.round(percent)}%`;
        }

        // ====== Haupt-IPC Event ======
        ipcRenderer.on('updater:status', (event, { status, progress, retryCount }) => {
            let showProgress = false;
            let customInfo = '';

            // 1. Update-Installation mit Fortschritt
            if (progress !== undefined && progress !== null &&
                (status.toLowerCase().includes('install') || status.toLowerCase().includes('download') || progress > 0)) {
                showProgress = true;
                updateProgressUI(progress);

                let displayStatus;
                if (status.toLowerCase().includes('download')) {
                    displayStatus = 'Lade Update herunter';
                    progressTitle.innerText = 'Download läuft';
                } else if (status.toLowerCase().includes('extract')) {
                    displayStatus = 'Entpacke Dateien';
                    progressTitle.innerText = 'Dateien werden entpackt';
                } else {
                    displayStatus = 'Update wird eingespielt';
                    progressTitle.innerText = 'Update wird installiert';
                }

                stopDotsAndSetText(`${displayStatus} · ${Math.round(progress)}%`);
                setStatusIcon('progress');
                progressArea.style.display = 'flex';

                if (progress >= 99.5) {
                    stopDotsAndSetText('Fertig! Neustart wird vorbereitet…');
                }
            }
            else {
                showProgress = false;
                progressArea.style.display = 'none';

                const lowerStatus = status.toLowerCase();
                if (lowerStatus.includes('search') || lowerStatus.includes('check') || lowerStatus === 'starting' || lowerStatus.includes('prüfe')) {
                    startDotsAnimation('Suche nach Updates');
                    setStatusIcon('default');
                }
                else if (lowerStatus.includes('no update') || lowerStatus.includes('uptodate') || lowerStatus.includes('aktuell')) {
                    stopDotsAndSetText('Alles aktuell ✨');
                    customInfo = 'VoidrixClient ist auf dem neuesten Stand';
                    setStatusIcon('default');
                }
                else if (lowerStatus.includes('error') || lowerStatus.includes('fehler')) {
                    stopDotsAndSetText('Verbindungsproblem');
                    setStatusIcon('warning');
                    customInfo = 'Update-Check fehlgeschlagen';
                }
                else if (lowerStatus.includes('download') && progress === undefined) {
                    startDotsAnimation('Lade Informationen');
                }
                else {
                    stopDotsAndSetText(status);
                }
            }

            // Retry-Anzeige
            if (retryCount !== undefined && retryCount > 0) {
                infoNote.innerHTML = `<div class="retry-badge"><span>⏳</span> <i>Wiederholung ${retryCount}/3 · erneute Verbindung</i></div>`;
                infoNote.style.background = 'rgba(251,191,36,0.10)';
                infoNote.style.borderColor = 'rgba(251,191,36,0.35)';
                if (!showProgress) setStatusIcon('warning');
            }
            else if (customInfo) {
                infoNote.innerHTML = `<span>${customInfo}</span>`;
                infoNote.style.background = 'rgba(0,0,0,0.4)';
                infoNote.style.borderColor = 'rgba(255,255,255,0.06)';
            }
            else if (showProgress) {
                infoNote.innerHTML = `<span>💿 Bitte warten — Installation läuft</span>`;
                infoNote.style.background = 'rgba(168,85,247,0.10)';
                infoNote.style.borderColor = 'rgba(168,85,247,0.30)';
            }
            else {
                infoNote.innerHTML = `<span>⚡ Automatische Updates aktiv</span>`;
                infoNote.style.background = 'rgba(0,0,0,0.4)';
                infoNote.style.borderColor = 'rgba(255,255,255,0.06)';
            }

            // Abschluss-Status
            if (status && (status.toLowerCase().includes('complete') || status.toLowerCase().includes('finished'))) {
                stopDotsAndSetText('Neustart wird vorbereitet');
                progressFill.style.width = '100%';
                progressPercentSpan.innerText = '100%';
                infoNote.innerHTML = `<span>🎉 Update erfolgreich · VoidrixClient startet neu</span>`;
                realStartupFinished = true;
                finishStartupTimer();
            }

            if (showProgress) {
                if (dotInterval) clearInterval(dotInterval);
                isDotsMode = false;
            }

            statusTextSpan.classList.add('fade-up');
            setTimeout(() => statusTextSpan.classList.remove('fade-up'), 250);
        });

        // Startzustand
        startDotsAnimation('Suche nach Updates');

        // ====== Rotierende Lade-Tipps ======
        const tips = [
            'Tipp: Mit Rechtsklick auf eine Instanz öffnest du weitere Optionen.',
            'Tipp: Eigene Themes findest du im Styling-Bereich.',
            'Tipp: Backups deiner Welten laufen automatisch im Hintergrund.',
            'Tipp: Modpacks lassen sich per Code mit Freunden teilen.',
            'Wusstest du? Der Void hat dich lieb. 💜',
            'Tipp: Java-Einstellungen kannst du pro Instanz anpassen.',
            'Tipp: Der Cloud-Backup schützt deine Einstellungen.',
        ];
        let tipIndex = Math.floor(Math.random() * tips.length);
        tipText.textContent = tips[tipIndex];
        setInterval(() => {
            tipText.classList.add('fade');
            setTimeout(() => {
                tipIndex = (tipIndex + 1) % tips.length;
                tipText.textContent = tips[tipIndex];
                tipText.classList.remove('fade');
            }, 400);
        }, 5000);

        // ====== Aufsteigende Void-Partikel (dezente Ambient-Animation) ======
        const voidParticles = document.getElementById('voidParticles');
        const PARTICLE_COLORS = ['var(--accent)', 'var(--accent-2)', 'var(--accent-3)'];
        const PARTICLE_COUNT = 16;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const p = document.createElement('div');
            p.className = 'void-particle';
            const size = (Math.random() * 1.8 + 1.4).toFixed(1);
            const left = (Math.random() * 100).toFixed(1);
            const duration = (Math.random() * 6 + 6).toFixed(1);
            const delay = (-Math.random() * duration).toFixed(1);
            const opacity = (Math.random() * 0.35 + 0.4).toFixed(2);
            const color = PARTICLE_COLORS[i % PARTICLE_COLORS.length];
            p.style.cssText =
                `width:${size}px;height:${size}px;left:${left}%;` +
                `background:${color};box-shadow:0 0 ${size * 2}px ${color};` +
                `animation-duration:${duration}s;animation-delay:${delay}s;--p-op:${opacity};`;
            voidParticles.appendChild(p);
        }

        // ====== Startup-Timer ======
        window.addEventListener('load', () => {
            setTimeout(() => {
                startupTimerWrap.classList.add('visible');
                startupTimerActive = true;
                const duration = 5000;
                const start = performance.now();

                const run = (now) => {
                    const elapsed = now - start;
                    const progress = Math.min(1, elapsed / duration);
                    // Höchstens 95 %, bis der echte Abschluss-Status kommt.
                    setStartupTimerProgress(Math.round(progress * 95));

                    if (progress < 1) {
                        requestAnimationFrame(run);
                    } else if (realStartupFinished) {
                        finishStartupTimer();
                    } else {
                        startupTimerText.textContent = '95%';
                    }
                };

                requestAnimationFrame(run);
            }, 1200);
        });
    </script>
</body>
